# Scrapes every employer board, then publishes the site to GitHub Pages for free.
# Runs every 6 hours and on demand (Actions tab -> "Update InternScout" -> Run workflow).
name: Update InternScout
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = scrape everything; seed = publish seed/index.html right away"
        default: full
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Board state, cached descriptions and the last listings carry over between runs,
      # so after the first run only active boards are re-read.
      - uses: actions/cache@v4
        with:
          path: data
          key: scrape-${{ github.run_id }}
          restore-keys: scrape-
      - name: Publish the seed page (quick start)
        if: ${{ github.event.inputs.mode == 'seed' }}
        run: mkdir -p site && cp seed/index.html site/index.html
      - name: Scrape and build
        if: ${{ github.event.inputs.mode != 'seed' }}
        run: node scripts/scrape-once.mjs
        env:
          MAX_MINUTES: "320"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # optional: postings also listed on LinkedIn/Indeed, via Google for Jobs (licensed API)
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
